# Render Infrastructure as Code (Blueprint)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # 1. Static Web Dashboard (React + TypeScript + Vite + Lightweight Charts)
  - type: web
    name: optionmarketchart-web
    runtime: static
    repo: https://github.com/tspatel786/optionmarketchart
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_TELEGRAM_BOT_TOKEN
        sync: false
      - key: VITE_TELEGRAM_CHAT_ID
        sync: false
